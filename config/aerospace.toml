# AeroSpace, paired with the omni bar.
#
# gaps.outer.top is what keeps windows from sliding under the floating bar:
# the bar is 30pt tall at y=0 and macOS reserves nothing for it while the menu
# bar is auto-hidden. This is the only thing on macOS that can do that.
#
# Bindings deliberately avoid alt+letter: on the Polish keyboard layout those
# are the diacritics (alt-l = ł, alt-s = ś, alt-e = ę ...). Arrows and digits
# instead. alt-space stays free for the launcher.

start-at-login = false
after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 10
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# tell the bar which workspace is focused; it maps this onto its numbers
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical =   8
outer.left =       8
outer.bottom =     8
outer.right =      8
outer.top =        44      # bar (30) + breathing room

[mode.main.binding]
# focus / move: arrows, not hjkl
alt-left  = 'focus left'
alt-down  = 'focus down'
alt-up    = 'focus up'
alt-right = 'focus right'
alt-shift-left  = 'move left'
alt-shift-down  = 'move down'
alt-shift-up    = 'move up'
alt-shift-right = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-slash  = 'layout tiles horizontal vertical'
alt-comma  = 'layout accordion horizontal vertical'
alt-period = 'layout floating tiling'
alt-enter  = 'fullscreen'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-tab = 'workspace-back-and-forth'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
