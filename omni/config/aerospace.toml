config-version = 2

# AeroSpace, paired with the omni bar.
#
# gaps.outer.top is what keeps windows from sliding under the floating bar:
# the bar is 30pt tall at y=0 and macOS reserves nothing for it while the menu
# bar is auto-hidden. This is the only thing on macOS that can do that.
#
# Bindings deliberately avoid alt+letter: on the Polish keyboard layout those
# are the diacritics (alt-l = ł, alt-s = ś, alt-e = ę ...). Arrows and digits
# instead. alt-space stays free for the launcher.

start-at-login = false
after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 10
default-root-container-layout = 'floating'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# tell the bar which workspace is focused; it maps this onto its numbers
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# Ghostty's quick terminals (the omni launcher, hey-calendar) must never be
# tiled: once pulled into a workspace tree Ghostty loses track of the window
# and opens a fresh one on the next toggle, stranding the old session.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.window-title-regex-substring = 'omni-launcher|hey|calendar'
run = ['layout floating']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical =   8
outer.left =       8
outer.bottom =     8
outer.right =      8
outer.top =        44      # bar (30) + breathing room

[mode.main.binding]
# DELIBERATELY EMPTY. The arrow bindings that used to live here shadowed
# macOS's own text editing: alt-left / alt-right are move-by-word in every
# text field, and alt-shift-arrow is select-by-word. Avoiding alt+letter
# (the Polish diacritics) traded one conflict for a worse one.
#
# Drive AeroSpace from the CLI instead - `aerospace workspace 2`,
# `aerospace focus right`, `aerospace layout floating` - or bind keys that
# macOS does not already own (ctrl+alt+cmd combinations are usually free)
# before turning tiling back on.

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
