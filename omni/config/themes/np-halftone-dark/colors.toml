# Halftone (dark) - NordPass theme proposal for omni (atmosphere round).
# Brand tokens read from nordpass.com CSS custom properties on 2026-09-15:
#   beige 100/200/300/500/600 #faf9f8 #f7f6f4 #f5f4f1 #eae6df #dedad3
#   green 200/700/900         #ccd9d5 #346955 #01432b
#   teal 100/300/500/600/700/800 and lime-400 #dbf153
#   neutral 0..1000           #ffffff .. #191a1c
# Values that are not tokens are a mix of two tokens; only light_foreground
# and lighter_background are ever mixed here.
